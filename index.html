<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Comercial v4.0 - Abastecer y Surtir</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0f19; color: #e2e8f0; font-family: sans-serif; padding: 20px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
  h1 { color: #38bdf8; font-size: 22px; }
  .backup-btns { display: flex; gap: 8px; }
  .backup-btns button, .backup-btns label { margin: 0; padding: 8px 12px; font-size: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; border: none; color: #fff; }
  .btn-save { background: #10b981; }
  .btn-load { background: #6366f1; display: inline-block; }
  .btn-print { background: #f59e0b; color: #0f172a !important; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; }
  h2 { font-size: 15px; color: #f8fafc; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
  label { display: block; font-size: 12px; color: #cbd5e1; margin-top: 10px; }
  input { width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 5px; }
  button.btn-add { width: 100%; padding: 10px; margin-top: 15px; background: #0284c7; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  .resumen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 15px; }
  .stat { background: #0f172a; padding: 14px; border-radius: 8px; border-left: 4px solid #38bdf8; }
  .stat span { font-size: 11px; color: #94a3b8; display: block; }
  .stat strong { font-size: 18px; color: #fff; margin-top: 4px; display: block; }
  .buscador { margin-bottom: 12px; border-color: #38bdf8; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 9px; border-bottom: 1px solid #334155; }
  th { color: #38bdf8; }
  .ganancia-txt { color: #4ade80; font-weight: bold; }
  .btn-abastecer { background: #3b82f6; color: #fff; border: none; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-right: 4px; }
  .btn-surtir { background: #f59e0b; color: #0f172a; border: none; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .alerta-baja { background: #ef4444 !important; color: #fff !important; }
  .btn-mini { padding: 5px 8px; margin: 0 3px 0 0; font-size: 11px; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: bold; }
  .btn-vender { background: #22c55e; }
  .btn-del { background: #64748b; }
</style>
</head>
<body><style>#v4lic,#v4log,#v4dash{position:fixed;inset:0;z-index:2147483647;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#fff}#v4log{z-index:2147483646;display:none}#v4dash{z-index:2147483648;display:none;overflow-y:auto;padding:20px}.v4box{background:#1e293b;padding:34px;border-radius:16px;border:1px solid #334155;width:410px;text-align:center}.v4dbox{background:#1e293b;padding:28px;border-radius:16px;border:1px solid #334155;width:720px;max-width:95vw}.v4box h2,.v4dbox h2{margin:0 0 8px;color:#38bdf8}.v4box input,.v4dbox input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:15px;box-sizing:border-box}.v4btn{width:100%;padding:13px;border:none;border-radius:8px;background:#0284c7;color:#fff;font-size:15px;font-weight:bold;margin-top:8px;cursor:pointer}.v4err{color:#f87171;display:none;margin-top:8px;font-size:14px}#v4bar{position:fixed;top:12px;right:16px;z-index:999999;display:flex;gap:8px;align-items:center;font-family:sans-serif}#v4tag{background:#1e293b;color:#38bdf8;border:1px solid #334155;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:bold}#v4dbtn{background:#0284c7;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer}#v4out{background:#dc2626;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer}.v4grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.v4kpi{background:#0f172a;padding:14px;border-radius:10px;border:1px solid #334155;text-align:center}.v4kpi b{display:block;font-size:20px;color:#34d399;margin-top:4px}</style>

<script>
function v4users(){var u=localStorage.getItem("v4_users");return u?JSON.parse(u):{"admin":"1234"}}
function v4chk(s){s=s.trim().toUpperCase();var p=s.split("-");if(p.length!==3||p.at(0)!=="EC")return 0;var exp=parseInt(p.at(1),36),sig=parseInt(p.at(2),36);if(isNaN(exp)||isNaN(sig))return 0;if(((exp*73+9842)%99991)!==sig)return 0;if(exp!==99999999&&Date.now()>exp*86400000)return -1;return exp}
function v4act(){var s=document.getElementById("v4s").value,r=v4chk(s);if(r>0){localStorage.setItem("v4_lic",s.trim().toUpperCase());document.getElementById("v4lic").style.display="none";document.getElementById("v4log").style.display="flex"}else{var e=document.getElementById("v4err1");e.innerText=r===-1?"Licencia vencida (30 dias)":"Serial incorrecto";e.style.display="block"}}
function v4rol(u){document.getElementById("v4tag").innerText="Turno: "+u;document.getElementById("k_usr").innerText=u;document.getElementById("v4dbtn").style.display=(u==="admin"?"inline-block":"none")}
function v4entrar(){var u=document.getElementById("v4u").value.trim(),p=document.getElementById("v4p").value.trim(),db=v4users();if(db[u]&&db[u]===p){sessionStorage.setItem("v4_ses",u);v4rol(u);document.getElementById("v4log").style.display="none"}else{document.getElementById("v4err2").style.display="block"}}
function v4salir(){sessionStorage.removeItem("v4_ses");document.getElementById("v4p").value="";document.getElementById("v4log").style.display="flex"}
function v4abrirDash(){var db=v4users();document.getElementById("k_cnt").innerText=Object.keys(db).length;var h="";for(var k in db){h+="<div style='display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e293b'><span>"+k+" (Clave: "+db[k]+")</span>"+(k!=="admin"?"<a href='#' style='color:#f87171' onclick='v4del(\""+k+"\");return false'>Eliminar</a>":"")+"</div>"}document.getElementById("v4list").innerHTML=h;document.getElementById("v4dash").style.display="flex"}
function v4crear(){var nu=document.getElementById("v4nu").value.trim(),np=document.getElementById("v4np").value.trim(),db=v4users();if(nu&&np){db[nu]=np;localStorage.setItem("v4_users",JSON.stringify(db));document.getElementById("v4nu").value="";document.getElementById("v4np").value="";v4abrirDash()}}
function v4del(k){var db=v4users();delete db[k];localStorage.setItem("v4_users",JSON.stringify(db));v4abrirDash()}
function v4csv(){var f=["Clave,Contenido"];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i),v=(localStorage.getItem(k)||"").replace(/"/g,'""').replace(/\n/g," ");f.push('"'+k+'","'+v+'"')}var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+f.join("\n")],{type:"text/csv;charset=utf-8;"}));a.download="Reporte_Tienda_"+new Date().toISOString().slice(0,10)+".csv";a.click()}
(function(){var s=localStorage.getItem("v4_lic");if(s){var r=v4chk(s);if(r>0){document.getElementById("v4lic").style.display="none";var u=sessionStorage.getItem("v4_ses");if(!u)document.getElementById("v4log").style.display="flex";else v4rol(u)}else if(r===-1){document.getElementById("v4msg").innerText="Licencia vencida. Ingrese nuevo serial:"}}if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");})();
</script>

<div class="top-bar">
  <div>
    <h1>SISTEMA COMERCIAL v4.0 // BODEGA Y ESTANTERÍA</h1>
    <p style="font-size:12px;color:#94a3b8;"><strong>Abastecer:</strong> Compra a proveedor (Bodega) | <strong>Surtir:</strong> Pasar de Bodega a Tienda</p>
  </div>
  <div class="backup-btns">
    <button class="btn-save" onclick="descargarRespaldo()">Guardar Copia</button>
    <label class="btn-load">Restaurar Copia <input type="file" accept=".json" style="display:none" onchange="cargarRespaldo(event)"></label>
    <button class="btn-print" onclick="window.print()">Imprimir</button>
  </div>
</div>
<div class="grid">
  <div class="card">
    <h2>Nuevo Producto</h2>
    <label>Nombre del producto</label><input type="text" id="nombre" placeholder="Ej. Arroz Flor 1lb">
    <label>Costo de Compra ($ USD)</label><input type="number" id="costo" placeholder="Ej. 1.10" step="0.01">
    <label>Precio de Venta ($ USD)</label><input type="number" id="precio" placeholder="Ej. 1.50" step="0.01">
    <label>Cantidad en Bodega</label><input type="number" id="bodega" placeholder="Ej. 80">
    <label>Cantidad en Tienda</label><input type="number" id="tienda" placeholder="Ej. 15">
    <button class="btn-add" onclick="agregarProducto()">+ Registrar Producto</button>
  </div>
  <div class="card">
    <div class="resumen">
      <div class="stat"><span>Capital Total</span><strong id="totalCapital">$0.00</strong></div>
      <div class="stat"><span>Ventas Realizadas</span><strong id="totalVentas">$0.00</strong></div>
      <div class="stat" style="border-color:#4ade80;"><span>Ganancia Neta</span><strong id="totalGanancia" style="color:#4ade80;">$0.00</strong></div>
      <div class="stat" style="border-color:#f87171;"><span>Alertas Stock</span><strong id="totalAlertas">0</strong></div>
    </div>
    <input type="text" id="filtro" class="buscador" placeholder="Buscar producto..." onkeyup="actualizarTodo()">
    <table>
      <thead><tr><th>Producto</th><th>P. Venta</th><th>Bodega</th><th>Tienda</th><th>Vendidos</th><th>Ganancia</th><th>Abastecer / Surtir</th><th>Venta</th></tr></thead>
      <tbody id="tablaBody"></tbody>
    </table>
  </div>
</div>
<script>
let productos = JSON.parse(localStorage.getItem("tienda_v4_datos")) || [
  { nombre: "Arroz Flor 1lb", costo: 1.10, precio: 1.50, bodega: 80, tienda: 10, ventas: 30 },
  { nombre: "Cemento Chimborazo 50kg", costo: 6.20, precio: 7.50, bodega: 250, tienda: 50, ventas: 89 },
  { nombre: "Aceite Cocina 1L", costo: 1.90, precio: 2.60, bodega: 4, tienda: 3, ventas: 28 }
];
function guardar() { localStorage.setItem("tienda_v4_datos", JSON.stringify(productos)); }
function agregarProducto() {
  const nombre = document.getElementById("nombre").value.trim();
  const costo = parseFloat(document.getElementById("costo").value) || 0;
  const precio = parseFloat(document.getElementById("precio").value);
  const bodega = parseInt(document.getElementById("bodega").value) || 0;
  const tienda = parseInt(document.getElementById("tienda").value) || 0;
  if (!nombre || isNaN(precio)) return alert("Completa nombre y precio.");
  productos.push({ nombre, costo, precio, bodega, tienda, ventas: 0 });
  guardar(); actualizarTodo();
  ["nombre","costo","precio","bodega","tienda"].forEach(id => document.getElementById(id).value = "");
}
function abastecerBodega(i) {
  const cant = parseInt(prompt(`ABASTECER BODEGA: ${productos[i].nombre}\nActual en Bodega: ${productos[i].bodega}\n¿Cuántas unidades compraste?`, "30"));
  if (!isNaN(cant) && cant > 0) { productos[i].bodega += cant; guardar(); actualizarTodo(); }
}
function surtirTienda(i) {
  const p = productos[i];
  if (p.bodega <= 0) return alert("Sin stock en Bodega. Primero usa Abastecer Bodega.");
  const cant = parseInt(prompt(`SURTIR TIENDA: ${p.nombre}\nEn Bodega: ${p.bodega} | En Tienda: ${p.tienda}\n¿Cuántas unidades pasas a Tienda?`, Math.min(10, p.bodega)));
  if (!isNaN(cant) && cant > 0 && cant <= p.bodega) { productos[i].bodega -= cant; productos[i].tienda += cant; guardar(); actualizarTodo(); }
}
function venderUno(i) {
  if (productos[i].tienda > 0) { productos[i].tienda -= 1; productos[i].ventas += 1; guardar(); actualizarTodo(); }
  else alert("Sin mercadería en Tienda. Usa Surtir Tienda.");
}
function eliminarProducto(i) { if (confirm("¿Eliminar producto?")) { productos.splice(i, 1); guardar(); actualizarTodo(); } }
function descargarRespaldo() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(productos, null, 2)], { type: "application/json" }));
  a.download = "respaldo_tienda_v4.json"; a.click();
}
function cargarRespaldo(e) {
  const r = new FileReader();
  r.onload = ev => { productos = JSON.parse(ev.target.result); guardar(); actualizarTodo(); };
  if (e.target.files) r.readAsText(e.target.files);
}
function actualizarTodo() {
  const tbody = document.getElementById("tablaBody");
  const f = document.getElementById("filtro").value.toLowerCase();
  tbody.innerHTML = "";
  let cap = 0, ven = 0, gan = 0, ale = 0;
  productos.forEach((p, i) => {
    cap += (p.costo || p.precio) * (p.bodega + p.tienda);
    ven += p.precio * p.ventas;
    const gProd = (p.precio - (p.costo || 0)) * p.ventas;
    gan += gProd;
    const bBaja = p.bodega <= 5, tBaja = p.tienda <= 5;
    if (bBaja || tBaja) ale++;
    if (p.nombre.toLowerCase().includes(f)) {
      tbody.innerHTML += `<tr><td><strong>${p.nombre}</strong></td><td>$${p.precio.toFixed(2)}</td>
        <td style="color:${bBaja?'#f87171':'#cbd5e1'};font-weight:bold;">${p.bodega}</td>
        <td style="color:${tBaja?'#fbbf24':'#4ade80'};font-weight:bold;">${p.tienda}</td>
        <td>${p.ventas}</td><td class="ganancia-txt">+$${gProd.toFixed(2)}</td>
        <td><button class="btn-abastecer ${bBaja?'alerta-baja':''}" onclick="abastecerBodega(${i})">Abastecer Bodega</button>
            <button class="btn-surtir ${tBaja&&!bBaja?'alerta-baja':''}" onclick="surtirTienda(${i})">Surtir Tienda</button></td>
        <td><button class="btn-mini btn-vender" onclick="venderUno(${i})">+1 Venta</button>
            <button class="btn-mini btn-del" onclick="eliminarProducto(${i})">X</button></td></tr>`;
    }
  });
  document.getElementById("totalCapital").innerText = "$" + cap.toFixed(2);
  document.getElementById("totalVentas").innerText = "$" + ven.toFixed(2);
  document.getElementById("totalGanancia").innerText = "+$" + gan.toFixed(2);
  document.getElementById("totalAlertas").innerText = ale;
}
actualizarTodo();
</script>
</body>
</html>
